[project]
name = "glucolit"
version = "0.1.0"
description = "GlucoLit is an AI-powered application that helps users understand and manage diabetes through personalized health insights."
readme = "README.md"
authors = [
    { name = "B Rithika", email = "b.rithika.aids28@princedrkvasudevan.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]



[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
