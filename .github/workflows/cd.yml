


name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      rollback_sha:
        description: "Full 40-character commit SHA to roll back to"
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to production
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest

    steps:
      - name: Select deployment SHA
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.event.workflow_run.head_sha }}
          ROLLBACK_SHA: ${{ inputs.rollback_sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            SHA="$WORKFLOW_SHA"
            DEPLOY_TYPE="normal"
          else
            SHA="$ROLLBACK_SHA"
            DEPLOY_TYPE="rollback"
          fi

          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Error: a full 40-character lowercase commit SHA is required."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "deploy_type=$DEPLOY_TYPE" >> "$GITHUB_OUTPUT"
          echo "Deploying commit: $SHA"
          echo "Deployment type: $DEPLOY_TYPE"

      - name: Checkout deployment commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.select.outputs.sha }}

      - name: Set up uv
        if: steps.select.outputs.deploy_type == 'normal'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install dependencies
        if: steps.select.outputs.deploy_type == 'normal'
        run: uv sync --locked

      - name: Run Neon database migrations
        if: steps.select.outputs.deploy_type == 'normal'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Skip migrations for rollback
        if: steps.select.outputs.deploy_type == 'rollback'
        run: echo "Rollback selected. Database migrations will not run."

      - name: Deploy exact SHA image to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          SHA: ${{ steps.select.outputs.sha }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${SHA}"

          ENCODED_IMAGE=$(python -c \
            'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' \
            "$IMAGE")

          if [[ "$RENDER_DEPLOY_HOOK" == *"?"* ]]; then
            DEPLOY_URL="${RENDER_DEPLOY_HOOK}&imgURL=${ENCODED_IMAGE}"
          else
            DEPLOY_URL="${RENDER_DEPLOY_HOOK}?imgURL=${ENCODED_IMAGE}"
          fi

          HTTP_CODE=$(curl -sS -o deploy-response.json \
            -w "%{http_code}" -X POST "$DEPLOY_URL")

          cat deploy-response.json

          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "202" ]]; then
            echo "Render deployment request failed: HTTP $HTTP_CODE"
            exit 1
          fi

          echo "Render accepted the deployment request."

      - name: Smoke test production
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
          EXPECTED_SHA: ${{ steps.select.outputs.sha }}
        run: |
          BASE_URL="${LIVE_URL%/}"

          if [ -z "$BASE_URL" ]; then
            echo "LIVE_URL repository variable is missing."
            exit 1
          fi

          echo "Waiting for version $EXPECTED_SHA..."

          FOUND=false

          for attempt in {1..60}; do
            if curl -fsS --max-time 10 "$BASE_URL/health" -o health.json; then
              ACTUAL_SHA=$(python -c \
                'import json; print(json.load(open("health.json")).get("version", ""))')

              if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
                FOUND=true
                echo "Health check reports expected commit: $ACTUAL_SHA"
                break
              fi
            fi

            echo "Attempt $attempt: waiting for deployment..."
            sleep 10
          done

          if [ "$FOUND" != "true" ]; then
            echo "Expected commit did not become healthy."
            cat health.json 2>/dev/null || true
            exit 1
          fi

          echo "Checking database readiness..."
          curl -fsS "$BASE_URL/ready" -o ready.json
          cat ready.json

          python -c \
            'import json; d=json.load(open("ready.json")); assert d.get("status") == "ready" and d.get("checks", {}).get("database") is True, "Database is not ready"'

          echo "Checking documents endpoint..."
          curl -fsS "$BASE_URL/v1/documents?limit=1" -o documents.json
          cat documents.json

          python -c \
            'import json; d=json.load(open("documents.json")); assert isinstance(d.get("items"), list) and isinstance(d.get("total"), int), "Unexpected documents response"'

          echo "All production smoke tests passed."
